apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: a360-faz-application
  namespace: argocd
  labels:
    service-id: fazportal
    app-id: a360
    owner: advisora360-platform
    support-group: advisora360-Support
    environement: dev
spec:
  project: default

  source:
    repoURL: https://github.com/2bibhu/TestSwiggy.git
    targetRevision: HEAD
    path: DemoApp
  destination: 
    server: https://kubernetes.default.svc
    namespace: myapp

  syncPolicy:
    syncOptions:
    - CreateNamespace=true

    automated:
      selfHeal: true
      prune: true
